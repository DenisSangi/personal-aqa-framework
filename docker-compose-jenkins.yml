# =============================================================================
#  CI-стенд: контроллер Jenkins + агент, на котором физически идут прогоны.
#
#  НАЗНАЧЕНИЕ И МЕСТО В CI/CD
#  Это сама инфраструктура. Поднимается один раз локально:
#      docker compose -f docker-compose-jenkins.yml up -d
#  Сценарий прогона здесь НЕ описан — он живёт в Jenkinsfile в репозитории,
#  и Jenkins забирает его из GitHub при каждой сборке.
#
#  Почему две машины. Контроллер планирует сборки и хранит конфигурацию;
#  агент их выполняет. На контроллере не гоняют: он тогда занят прогоном
#  и падает вместе с ним.
#
#  Почему файл отдельный от docker-compose.yml (там тестовая база
#  aqa-postgres): у CI-стенда и тестовых данных разные жизненные циклы.
#  При этом имя проекта Compose берёт из имени каталога, поэтому оба файла
#  дают ОДНУ сеть — контейнеры видят друг друга по DNS-именам без настройки.
#
#  РАЗБОР ЭЛЕМЕНТОВ
#
#  jenkins  — контроллер: веб-интерфейс, планировщик, хранилище джоб,
#             плагинов, нод и Credentials.
#    image:    готовый образ из реестра, описывать самому нечего.
#              Ссылка = репозиторий:тег (ср. groupId:artifactId в Maven),
#              lts = стабильная линия Long Term Support.
#    ports:    "хост:контейнер". Публикуем ТОЛЬКО веб-интерфейс, чтобы
#              открыть http://localhost:8080 в браузере на Маке. Порт агента
#              (50000) сознательно не публикуется: агент живёт в этой же
#              docker-сети и достаёт контроллер напрямую, минуя хост.
#    volumes:  named volume. Всё состояние Jenkins лежит внутри контейнера
#              в /var/jenkins_home и терялось бы при ПЕРЕСОЗДАНИИ контейнера
#              (не при остановке — stop/start данные хранит и без тома).
#              Том перехватывает запись наружу. Проверено дважды: контейнер
#              удалялся, новый поднимался со всей конфигурацией.
#
#  paf-agent-1 — агент: машина, на которой реально идёт `mvn clean test`.
#    build:    в отличие от контроллера образ СОБИРАЕТСЯ здесь — готового
#              образа с нужным набором (JDK + Maven + браузер + драйвер)
#              не существует. Рецепт — в Dockerfile.agent рядом.
#    (нет ports:)   соединение инициирует сам агент (inbound-схема): он идёт
#                   к контроллеру, а не контроллер к нему.
#    (нет volumes:) рабочий каталог одноразовый — каждая сборка заново
#                   клонирует репозиторий, хранить между прогонами нечего.
#    environment:
#      JENKINS_URL           адрес контроллера. Именно `jenkins` — имя сервиса
#                            выше, оно же DNS-имя внутри сети. `localhost`
#                            здесь означал бы САМ АГЕНТ.
#      JENKINS_AGENT_NAME    должно совпадать с именем ноды, заведённой в UI
#                            (Manage Jenkins → Nodes). Не путать с меткой
#                            docker-agent, по которой ноду выбирает Jenkinsfile:
#                            имя у ноды одно, меток может быть много.
#      JENKINS_WEB_SOCKET    транспорт WebSocket поверх того же 8080 вместо
#                            отдельного TCP 50000 — поэтому и хватает одного
#                            опубликованного порта.
#      JENKINS_AGENT_WORKDIR рабочий каталог агента внутри его контейнера.
#                            Значение взято из самого образа, а не придумано;
#                            оно же стоит в поле Remote root directory у ноды.
#      JENKINS_SECRET        одноразовый ключ, которым контроллер узнаёт свою
#                            ноду; выдаётся Jenkins'ом на странице ноды.
#                            Подставляется из файла .env, который лежит
#                            в .gitignore — в репозиторий секрет не попадает.
#
#  volumes: (нижний блок) — объявление тома. Пустое значение справа означает
#           настройки по умолчанию. Это СОСЕД services:, а не его часть.
# =============================================================================

services:
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
    volumes:
      - jenkins-controller-data:/var/jenkins_home

  paf-agent-1:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: paf-agent-1
      JENKINS_WEB_SOCKET: true
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_SECRET: ${JENKINS_SECRET}

volumes:
  jenkins-controller-data:
